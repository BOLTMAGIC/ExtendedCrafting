    Extended Crafting with 11x11 and 13x13 crafting tables, automatic variants, and configurable crafting times per tier.
    '''

    [[dependencies.extendedcrafting]]
        modId="neoforge"
        mandatory=true
        versionRange="[26.1.2.41-beta,)"
        ordering="NONE"
        side="BOTH"
    [[dependencies.extendedcrafting]]
        modId="minecraft"
        mandatory=true
        versionRange="[26.1.2,26.2)"
        ordering="NONE"
        side="BOTH"
    [[dependencies.extendedcrafting]]
        modId="cucumber"
        mandatory=true
        versionRange="[${cucumber_version},)"
        ordering="NONE"
        side="BOTH"
