[[mixins]]
    config="extendedcrafting.mixins.json"

[[mods]]
    issueTrackerURL="https://github.com/BOLTMAGIC/ExtendedCrafting/issues"
    modId="extendedcrafting"
    version="${mod_version}"
    displayName="Extended Crafting: Expanded Plus"
    displayURL="https://github.com/BOLTMAGIC/ExtendedCrafting"
    # logoFile="examplemod.png"
    authors="Knozyy, BOLT_M4G1C, WithersChat, BlakeBr0"
